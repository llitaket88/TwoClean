[package]
name = "TwoClean"
version = "1.2.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow  = "1.0.4"
gpui-kit = "0.7"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "0.3.8" }
gpui_http_client = { package = "gpui-pre-http-client", version = "0.3.8" }
sysinfo = "0.39.6"
uuid = "1.27.0"
walkdir = "2.5.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
serde_json = "1.0.151"
futures = "0.3.34"

[build-dependencies]
winres = "0.1"
