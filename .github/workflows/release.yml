name: Build and Publish New Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows
    if: github.event.base_ref == 'refs/heads/master'
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/TwoClean.exe -Algorithm SHA256).Hash
          "$hash TwoClean.exe" | Out-File -FilePath target/release/TwoClean.exe.sha256 -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TwoClean-exe
          path: |
            target/release/TwoClean.exe
            target/release/TwoClean.exe.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Версия ${{ github.ref_name }}
          body_path: docs/CHANGELOG-${{ github.ref_name }}.md
          files: target/release/TwoClean.exe
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
